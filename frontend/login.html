<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · AgencyOS</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <main class="auth-page">
    <div class="card auth-card">
      <div class="brand">
        <div class="brand-mark">OS</div>
        <div>
          <div class="brand-name">AgencyOS</div>
          <div class="brand-sub">AI Agency Operating System</div>
        </div>
      </div>
      <h1>Sign in</h1>
      <p class="muted auth-lead">Internal access for the agency team.</p>

      <div id="login-error" class="form-error hidden" role="alert"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" id="login-submit" type="submit">Sign in</button>
      </form>

      <form id="mfa-form" class="hidden" novalidate>
        <p class="muted">Enter the 6-digit code from your authenticator app.</p>
        <div class="field" id="mfa-code-field">
          <label for="mfa-code">Authentication code</label>
          <input class="input" id="mfa-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" pattern="[0-9 ]*">
        </div>
        <div class="field hidden" id="mfa-recovery-field">
          <label for="mfa-recovery">Recovery code</label>
          <input class="input" id="mfa-recovery" name="recovery" autocomplete="off" maxlength="20" placeholder="xxxxx-xxxxx">
        </div>
        <button class="btn btn-primary btn-block" id="mfa-submit" type="submit">Verify</button>
        <button class="btn btn-ghost btn-block mt-8" id="mfa-toggle" type="button">Use a recovery code instead</button>
        <button class="btn btn-ghost btn-block" id="mfa-back" type="button">Back</button>
      </form>

      <div id="demo-block" class="hidden">
        <div class="divider">development only</div>
        <button class="btn btn-block" id="demo-login" type="button">Continue as demo founder</button>
        <p class="field-hint mt-8">Demo login is enabled by ENABLE_DEMO_LOGIN in a development environment. It is refused in production.</p>
      </div>
    </div>
  </main>
  <script type="module" src="/assets/js/login.js"></script>
</body>
</html>
