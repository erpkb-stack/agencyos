name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (SQLite) + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term --cov-fail-under=90

  postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: agencyos
          POSTGRES_DB: agencyos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agencyos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agencyos:agencyos@localhost:5432/agencyos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests against PostgreSQL
        working-directory: backend
        run: python -m pytest

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Bandit (medium and high severity fail the build)
        run: bandit -r backend/app -ll
      - name: Known-vulnerable dependencies
        run: pip-audit -r requirements.txt

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agencyos:ci .
      - name: Start container (production mode)
        run: |
          docker run -d --name agencyos -p 8000:8000 \
            -e SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            -e COOKIE_SECURE=false \
            agencyos:ci
      - name: Wait until ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs agencyos
          exit 1
      - name: Smoke test
        run: |
          set -e
          echo "Ci-Smoke-Pass-2026" | docker exec -i agencyos python -m app.cli create-user \
            --email ci@example.com --name "CI" --role FOUNDER --password-stdin
          curl -fsS -c jar -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","password":"Ci-Smoke-Pass-2026"}' \
            http://localhost:8000/api/v1/auth/login > /dev/null
          curl -fsS -b jar http://localhost:8000/api/v1/agents | python3 -c \
            "import json,sys; n=len(json.load(sys.stdin)['items']); assert n == 11, n; print(n, 'agents')"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/docs)" = "404"
          curl -fsS http://localhost:8000/ | grep -q "AgencyOS"
          docker exec agencyos python -m app.cli backup-db
      - name: Container logs
        if: always()
        run: docker logs agencyos || true
