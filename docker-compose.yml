services:
  agencyos:
    build: .
    image: agencyos:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/agencyos.db
    volumes:
      - agencyos-data:/app/data
      - agencyos-storage:/app/storage
    restart: unless-stopped

volumes:
  agencyos-data:
  agencyos-storage:
